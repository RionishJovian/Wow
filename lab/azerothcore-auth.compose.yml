# Disposable, loopback-only AzerothCore auth integration lab. No game assets.
# Uses the upstream acore-docker service images and environment conventions.
# This is NOT the production game world, and Docker image tag `master` moves.
name: wotlk-auth-lab
services:
  ac-database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${WOTLK_LAB_DB_PASSWORD:?Set a unique lab-only database password}
    volumes:
      - lab-database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --user=root --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 50
    networks: [lab-network]

  ac-db-import:
    image: acore/ac-wotlk-db-import:master
    environment:
      AC_DISABLE_INTERACTIVE: "1"
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${WOTLK_LAB_DB_PASSWORD};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${WOTLK_LAB_DB_PASSWORD};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${WOTLK_LAB_DB_PASSWORD};acore_characters"
    depends_on:
      ac-database:
        condition: service_healthy
    restart: "no"
    networks: [lab-network]

  ac-authserver:
    image: acore/ac-wotlk-authserver:master
    ports:
      - "127.0.0.1:${WOTLK_LAB_AUTH_PORT:-3724}:3724"
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${WOTLK_LAB_DB_PASSWORD};acore_auth"
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
    restart: "no"
    networks: [lab-network]

volumes:
  lab-database:

networks:
  lab-network:
