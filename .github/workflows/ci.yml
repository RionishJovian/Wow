name: Tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/azerothcore_browser_auth.mjs && node --check web/main.mjs && node --check web/input.mjs && node --check web/runtime_adapter.mjs && node --check web/local_client_resource.mjs
      - run: node --test tests/*.test.mjs
