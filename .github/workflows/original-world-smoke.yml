name: Original offline world WebGL2 smoke
on:
  push:
    paths:
      - 'web/original_world.mjs'
      - 'web/original_world_mission.mjs'
      - 'web/world_smoke.html'
      - 'scripts/smoke_original_world.py'
      - '.github/workflows/original-world-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Render original demo and verify movement/jump with software WebGL2
        run: python -m scripts.smoke_original_world --screenshot original-world.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-world-browser-preview
          path: original-world.png
          if-no-files-found: ignore
          retention-days: 5
